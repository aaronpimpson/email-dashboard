<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Triage</title>
<style>
  body { background: #111318; color: #e8e8e8; font-family: 'Segoe UI', Arial, sans-serif;
         max-width: 900px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; letter-spacing: 1px; margin-bottom: 4px; }
  .sub { color: #9aa3b2; font-size: 12px; margin-bottom: 24px; }
  .tabs { display: flex; gap: 8px; border-bottom: 1px solid #2a2e38; padding-bottom: 12px; }
  .tab { background: #191c24; border: 1px solid #2a2e38; color: #9aa3b2; padding: 8px 18px;
         border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .tab.active { color: #111318; background: #7fd4ff; border-color: #7fd4ff; }
  h2 { font-size: 15px; color: #7fd4ff; margin: 30px 0 6px; }
  .item { background: #191c24; border-left: 3px solid #2a2e38; padding: 12px 14px; margin: 8px 0;
          border-radius: 0 6px 6px 0; display: flex; align-items: center; gap: 14px; }
  .item.needs_reply { border-left-color: #ff6a6a; }
  .item .body { flex: 1; min-width: 0; }
  .meta { color: #9aa3b2; font-size: 12px; margin-bottom: 3px; }
  .item a { color: #ffd166; text-decoration: none; font-weight: 600; }
  .item a:hover { text-decoration: underline; }
  .reason { font-size: 13px; color: #cfd3da; margin-top: 3px; }
  .btns { display: flex; gap: 6px; flex-shrink: 0; }
  button { background: #22262f; color: #e8e8e8; border: 1px solid #343a46; border-radius: 5px;
           padding: 6px 12px; cursor: pointer; font-size: 12px; }
  button:hover { background: #2e3340; }
  button.done { border-color: #58d68d; color: #58d68d; }
  button.ignore { border-color: #9aa3b2; color: #9aa3b2; }
  .empty { color: #9aa3b2; font-style: italic; margin-top: 30px; }
</style>
</head>
<body>
<h1>EMAIL TRIAGE</h1>
<div class="sub" id="sub"></div>
<div class="tabs" id="tabs"></div>
<div id="content"></div>
<script>
let state = { items: {} };
let tab = 'pending';

const TABS = ['pending', 'done', 'ignored'];

async function load() {
  state = await (await fetch('/api/state')).json();
  render();
}

async function setStatus(id, status) {
  await fetch('/api/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ thread_id: id, status })
  });
  load();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function render() {
  const items = Object.entries(state.items || {});
  const counts = { pending: 0, done: 0, ignored: 0 };
  items.forEach(([, it]) => counts[it.status]++);

  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  TABS.forEach(t => {
    const b = el('button', 'tab' + (t === tab ? ' active' : ''),
      t.toUpperCase() + ' (' + counts[t] + ')');
    b.onclick = () => { tab = t; render(); };
    tabs.appendChild(b);
  });

  document.getElementById('sub').textContent =
    state.last_run ? 'Last scan: ' + state.last_run : '';

  const content = document.getElementById('content');
  content.innerHTML = '';
  const shown = items.filter(([, it]) => it.status === tab);
  if (!shown.length) {
    content.appendChild(el('div', 'empty',
      tab === 'pending' ? 'Nothing needs you.' : 'Nothing here.'));
    return;
  }

  const byAccount = {};
  shown.forEach(([id, it]) => {
    (byAccount[it.account] = byAccount[it.account] || []).push([id, it]);
  });

  Object.keys(byAccount).sort().forEach(account => {
    content.appendChild(el('h2', null, account));
    byAccount[account]
      .sort((a, b) => (b[1].sort_ts || b[1].added || '')
        .localeCompare(a[1].sort_ts || a[1].added || ''))
      .forEach(([id, it]) => {
        const card = el('div', 'item ' + (it.bucket || ''));
        const body = el('div', 'body');
        body.appendChild(el('div', 'meta',
          (it.date || '') + ' · ' + (it.sender || '') +
          (it.bucket === 'maybe' ? ' · maybe' : '')));
        const a = el('a', null, it.subject || '(no subject)');
        a.href = 'https://mail.google.com/mail/?authuser=' +
          encodeURIComponent(it.account) + '#all/' + id;
        a.target = '_blank';
        body.appendChild(a);
        body.appendChild(el('div', 'reason', it.reason || ''));
        card.appendChild(body);

        const btns = el('div', 'btns');
        if (tab === 'pending') {
          const d = el('button', 'done', 'DONE');
          d.onclick = () => setStatus(id, 'done');
          const g = el('button', 'ignore', 'IGNORE');
          g.onclick = () => setStatus(id, 'ignored');
          btns.appendChild(d);
          btns.appendChild(g);
        } else {
          const r = el('button', null, 'RESTORE');
          r.onclick = () => setStatus(id, 'pending');
          btns.appendChild(r);
        }
        card.appendChild(btns);
        content.appendChild(card);
      });
  });
}

load();
</script>
</body>
</html>
